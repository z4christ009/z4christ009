name: Deploy to GitHub Pages

# Publishes the repository root as a static site:
#   /         → Eat n Run
#   /barber/  → A7AA Barber Shop
#
# `enablement: true` turns GitHub Pages on the first time this runs, so the
# repository settings don't need to be touched by hand.

on:
  push:
    branches: [claude/eat-n-run-contacts-rawgmk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
